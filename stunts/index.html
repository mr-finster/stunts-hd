<script>self.stuntsBuild = '__BUILD__';   // (the site's version, stamped by tools/site.py: each script's address carries it, so a browser's cache never mixes two versions)</script>

<script src="setup.js?v=__BUILD__"></script>
<script>
'use strict';
// Starting: your copy of the game (the welcome screen, or the one kept in this browser), its code made from it here
// (boot.js), then the page (main.js) and its extras (qol.js). ?setup shows the welcome screen again.
(async () => {
  const load = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('could not load ' + src)); document.body.appendChild(s); });
  const again = /[?&]setup\b/.test(location.search), mine = again ? null : await StuntsSetup.load();
  let files = null, code = null, note = '';
  if (mine && StuntsSetup.complete(mine)) try { code = await StuntsBoot.code(mine); files = mine; } catch (e) { note = `<span class="bad">${e.message}</span>`; }
  else if (mine) note = '<span class="bad">The game files kept in this browser are incomplete: please load your stunts.zip again.</span>';
  // (a copy of the game next to the page, for development; a host answering every path with its page is not one)
  if (!code && !again && !mine) try {
    const r = await fetch('../vendor/restunts/stunts/game.exe');
    if (r.ok && !/html/.test(r.headers.get('content-type') || '')) code = await StuntsBoot.code(null, new Uint8Array(await r.arrayBuffer()));
  } catch (_) {}
  // the welcome screen, every time but with the developer copy: with a copy kept in this browser its big button reads
  // Start game (quitting the game reloads the page, which comes back here)
  // (back after a new version of the site was put up as you pressed Start (main.js): straight into the game, once)
  let restart = false; try { restart = sessionStorage.getItem('stunts-restart-go') === '1'; sessionStorage.removeItem('stunts-restart-go'); } catch (_) {}
  // (the desktop app: straight into the game when you asked to skip this screen, unless its Welcome Screen menu brought
  // you here (?welcome); fullscreen at the start when you asked for that too)
  const host = window.stuntsHost, welcome = /[?&]welcome\b/.test(location.search);
  let pref = k => { try { return localStorage.getItem('stunts-app-' + k) !== '0'; } catch (_) { return true; } };   // (both on unless turned off)
  if (host && code && files && !again && !welcome && pref('skip')) restart = true;
  if ((!code || files) && !(restart && code && files)) {
    files = await new Promise(res => StuntsSetup.show(res, note, StuntsBoot.code, files));
    code = await StuntsBoot.code(files);
    if (again) history.replaceState(null, '', location.pathname + location.search.replace(/[?&]setup\b/, '').replace(/^&/, '?') + location.hash);
  }
  if (host && pref('full')) host.fullscreen(true);
  if (welcome) history.replaceState(null, '', location.pathname);
  window.stuntsBoot = { files, code };
  try { await load(code.url); await load('main.js?v=' + self.stuntsBuild); if (!self.stuntsReloading) await load('qol.js?v=' + self.stuntsBuild); }
  catch (e) { const el = document.getElementById('err'); el.hidden = false; el.textContent = e.message; }
})();
</script>
